<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Wexipedia · Cronología y tránsitos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Disposición (v2, 2026-11-02; personas, 2026-11-12): eje VERTICAL a la izquierda, pasado arriba. A su derecha,
   tres columnas de tarjetas, una por carril. Las personas no se dibujan: el eje hace de lupa (quién vivía en cada
   año) y, al elegir una persona, su vida se marca sobre el eje.
   La altura de cada década depende de cuántas tarjetas tiene: los siglos densos (XIX, XX) se abren
   y los vacíos se comprimen. Las tarjetas llevan a sus conexiones; la ficha completa se abre a la derecha. */
:root {
  --bg: #eef2f1;
  --hoja: #fbfcfc;
  --tinta: #18222c;
  --tenue: #5a6772;
  --linea: #cfd8da;
  --banda: #e5eae9;
  --acento: #24557f;
  --aviso-bg: #fff4d6; --aviso-tx: #6b4c00;

  /* Tres carriles (REGLAS §8, 2026-11-11) */
  --c-politica-economia: #b0462d;
  --c-ciencia-saber: #2b68ad;
  --c-personas: #5d6b79;
  --c-religion: #8a4670;
  --c-politica: #b0462d;
  --c-sociedad: #9c7212;
  --c-fisica:   #2b68ad;
  --c-quimica:  #10807f;
  --c-biologia: #3c8537;
  --c-salud:    #5646c0;
  --c-filosofia: #6b5a8c;
  --c-literatura: #8c5a4a;
  --c-saberes:  #7b6f12;

  --f-lectura: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cab: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --hoja: #18212a; --tinta: #e3e9ee; --tenue: #93a1ad; --linea: #2c3944; --banda: #151d24;
  --acento: #8fbbe6; --aviso-bg: #3a3014; --aviso-tx: #f2d98c;
  --c-politica-economia: #ec8a70; --c-ciencia-saber: #77abe8;
  --c-personas: #9aa8b6; --c-religion: #d690bb; --c-politica: #ec8a70; --c-sociedad: #d9b158;
  --c-fisica: #77abe8; --c-quimica: #5cc6c2; --c-biologia: #86c97e; --c-salud: #a59af0; --c-filosofia: #b3a3d6; --c-literatura: #d6a493; --c-saberes: #c9bc5a;
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #11171d; --hoja: #18212a; --tinta: #e3e9ee; --tenue: #93a1ad; --linea: #2c3944; --banda: #151d24;
  --acento: #8fbbe6; --aviso-bg: #3a3014; --aviso-tx: #f2d98c;
  --c-politica-economia: #ec8a70; --c-ciencia-saber: #77abe8;
  --c-personas: #9aa8b6; --c-religion: #d690bb; --c-politica: #ec8a70; --c-sociedad: #d9b158;
  --c-fisica: #77abe8; --c-quimica: #5cc6c2; --c-biologia: #86c97e; --c-salud: #a59af0; --c-filosofia: #b3a3d6; --c-literatura: #d6a493; --c-saberes: #c9bc5a;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--tinta); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

/* ---------- Barra ---------- */
.barra { background: var(--hoja); border-bottom: 1px solid var(--linea);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.fila1 { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.marca { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.marca h1 { margin: 0; font-family: var(--f-lectura); font-weight: 600; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.marca span { color: var(--tenue); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.seg { display: inline-flex; border: 1px solid var(--linea); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--linea); }
.seg button[aria-pressed="true"] { background: var(--tinta); color: var(--hoja); }
.btn { border: 1px solid var(--linea); background: transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.btn b { font-family: var(--f-num); font-weight: 500; }
.busca { display: flex; gap: 8px; flex-wrap: wrap; }
.busca input, .busca select { border: 1px solid var(--linea); border-radius: 6px; background: var(--bg); padding: 6px 10px; min-width: 0; }
.busca input { width: 190px; }

.carriles-sw { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linea); border-radius: 999px;
  padding: 3px 10px 3px 7px; background: transparent; cursor: pointer; font-size: 13px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { color: var(--tenue); border-style: dashed; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.aviso { background: var(--aviso-bg); color: var(--aviso-tx); font-size: 13px; border-radius: 6px; padding: 6px 10px; }

/* ---------- Escena vertical ---------- */
.mesa { flex: 1; min-height: 0; display: flex; position: relative; }
.escena { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; position: relative; overscroll-behavior: contain; }
.cab { position: sticky; top: 0; z-index: 6; height: var(--cab); background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--linea); }
.cab > * { position: absolute; top: 0; height: 100%; display: flex; align-items: center; }
.cab .ahora { left: 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); font: 500 12px var(--f-num); color: var(--tinta); white-space: nowrap; }
.cab .ahora em { font: italic 15px var(--f-lectura); margin-right: 6px; }
.cab .col-n { gap: 9px; font: 600 14px var(--f-ui); text-transform: uppercase; letter-spacing: .18em; color: var(--tinta); white-space: nowrap; overflow: hidden; padding-bottom: 3px; }
.cab .col-n::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--grad, var(--tinta)); }
.cab .col-n span { overflow: hidden; text-overflow: ellipsis; }
.cab .col-n i { flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
.cab .col-n.vidas-n { justify-content: center; }

.lienzo { position: relative; }
.banda { position: absolute; left: 0; right: 0; background: var(--banda); }
.era-n { position: absolute; right: 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--tenue); opacity: .8; }
.regla-s { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--linea); }
.regla-s span { position: absolute; top: -10px; left: 6px; font: italic 600 15px var(--f-lectura); color: var(--tinta); background: var(--bg); padding: 0 4px; border-radius: 3px; }
.tk { position: absolute; font: 500 11.5px var(--f-num); color: var(--tenue); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.tk::after { content: ""; position: absolute; top: 50%; width: 6px; border-top: 1px solid var(--tenue); margin-left: 5px; }
.eje-l { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--tinta); opacity: .55; }
.hueco { position: absolute; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tenue); font-style: italic; font-family: var(--f-lectura); }
.hueco::before { content: ""; width: 16px; border-top: 2px dotted var(--tenue); }

@keyframes destello-v { 0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--acento) 60%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
/* Zona de cada franja de vidas y «lupa» de contemporáneos (2026-11-12) */
#vzonas .vz { position: absolute; top: 0; cursor: crosshair; }
#vzonas .vz:hover { background: color-mix(in srgb, var(--banda) 80%, transparent); }
/* Vida de la persona elegida (o señalada en la lupa), marcada sobre el eje */
#vida-sel { position: absolute; width: 6px; border-radius: 3px; background: var(--c); pointer-events: none; z-index: 3; box-shadow: 0 0 0 2px var(--bg); }
#vida-sel.aprox { -webkit-mask-image: linear-gradient(transparent, #000 10px, #000 calc(100% - 10px), transparent); mask-image: linear-gradient(transparent, #000 10px, #000 calc(100% - 10px), transparent); }
#vida-sel.destello { animation: destello-v 1.1s ease-out; }
.contemp h4 { margin: 10px 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
.contemp details summary { cursor: pointer; color: var(--acento); font-size: 13px; margin: 2px 0 4px; }
.aviso button { margin-left: 10px; font: inherit; font-weight: 600; color: inherit; background: none; border: 1px solid currentColor; border-radius: 5px; padding: 1px 8px; cursor: pointer; }
#lupa { position: absolute; z-index: 6; width: 250px; max-height: 60vh; overflow: auto; background: var(--hoja); border: 1px solid var(--linea); border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 8px 10px 10px; font-family: var(--f-ui); font-size: 12.5px; }
#lupa .lupa-t { font: 600 12px var(--f-num); color: var(--tenue); }
#lupa .lupa-a { font-size: 11px; color: var(--tenue); margin: 2px 0 4px; }
#lupa h4 { margin: 7px 0 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
#lupa button { display: flex; width: 100%; gap: 6px; align-items: baseline; text-align: left; background: none; border: 0; padding: 2px 0; color: var(--tinta); cursor: pointer; font: inherit; }
#lupa button:hover { color: var(--acento); }
#lupa button i { flex: none; width: 3px; height: 11px; border-radius: 2px; background: var(--c); }
#lupa button span { margin-left: auto; padding-left: 6px; color: var(--tenue); font: 11px var(--f-num); white-space: nowrap; }
#lupa-l { position: absolute; height: 0; border-top: 1.5px solid var(--tinta); opacity: .55; pointer-events: none; z-index: 5; }

/* ---------- Tarjetas ---------- */
.tj { position: absolute; background: var(--hoja); border: 1px solid var(--linea); border-left: 3px solid var(--c); border-radius: 6px;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--tinta) 6%, transparent); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.tj.prueba { border-style: dashed; border-left-style: solid; }
.tj-a { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 9px 7px 9px; cursor: pointer; }
.tj-m { display: flex; gap: 8px; align-items: baseline; font: 500 11.5px var(--f-num); color: var(--tenue); white-space: nowrap; }
.tj-m > span:first-child { flex: none; }
.tj-m .k { font-family: var(--f-ui); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--c); font-weight: 600; margin-left: auto; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.tj-m .k > span + span::before { content: " · "; }
.solo .tj-m .k .kc { display: none; }
.solo .tj-m .k .kc + span::before { content: none; }
.tj-m .k .sal { color: var(--aviso-tx); }
.tj-t { display: block; font-family: var(--f-lectura); font-weight: 600; font-size: 15.5px; line-height: 1.22; margin-top: 2px; text-wrap: pretty; }
.tj-r { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-family: var(--f-lectura); font-size: 13.5px; line-height: 1.4; color: var(--tenue); margin-top: 4px; }
.tj-x { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 9px 8px; }
.tj-x button { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; border: 1px solid var(--linea); background: transparent; border-radius: 999px;
  padding: 1px 8px 1px 6px; font-size: 12px; cursor: pointer; color: var(--tinta); }
.tj-x button i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tj-x button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tj-x button:hover { border-color: var(--tinta); }
.tj-x .mas { color: var(--tenue); }
/* Versión oficial: siempre presente en la tarjeta, desplegable (REGLAS §9, 2026-11-11) */
.tj-o { padding: 0 9px 7px; font-family: var(--f-ui); font-size: 12px; color: var(--tenue); }
.tj-o summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 5px; padding: 1px 0; }
.tj-o summary::-webkit-details-marker { display: none; }
.tj-o summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
.tj-o[open] summary::before { transform: rotate(90deg); }
.tj-o summary:hover { color: var(--tinta); }
.tj-o p { margin: 4px 0 0; padding-left: 8px; border-left: 2px solid var(--linea); font-family: var(--f-lectura); font-size: 13px; line-height: 1.45; color: var(--tinta); }
.tj-o .tj-of { display: block; margin-top: 4px; padding-left: 10px; font-size: 11.5px; }
.tj-o .tj-of a { color: var(--acento); }
.tj-o.falta { font-style: italic; }
.tj-o.falta.obligatoria { font-style: normal; color: var(--aviso-tx); }
.compacto .tj-o { padding: 0 8px 5px; }
.compacto .tj-r, .compacto .tj-x { display: none; }
.compacto .tj-a { padding: 5px 8px; }
.compacto .tj-t { font-size: 14px; }
.tj:hover { border-color: var(--tenue); border-left-color: var(--c); }
.tj.sel { box-shadow: 0 0 0 2px var(--tinta), 0 6px 18px color-mix(in srgb, var(--tinta) 18%, transparent); z-index: 3; }
.tj.rel { box-shadow: 0 0 0 1.5px var(--c); z-index: 2; }
.tj.ten { opacity: .25; }
.tj.destello { animation: destello 1.1s ease-out; }
@keyframes destello { 0% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--acento) 55%, transparent); } 100% { box-shadow: 0 0 0 2px var(--tinta); } }

.lineas { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
.lineas path { fill: none; stroke: var(--tinta); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: .6; }

.volver { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 8;
  border: 1px solid var(--tinta); background: var(--tinta); color: var(--hoja); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  max-width: min(420px, 80%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

/* ---------- Ficha lateral ---------- */
.ficha { width: min(560px, 44vw); flex: none; background: var(--hoja); border-left: 1px solid var(--linea); overflow-y: auto;
  container-type: inline-size; padding-right: env(safe-area-inset-right, 0px); }
.ficha-in { padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 18px; }
.ficha-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cerrar { margin-left: auto; border: 1px solid var(--linea); background: transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pill { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.carr { color: var(--c); }
.pill.est-prueba { color: var(--aviso-tx); background: var(--aviso-bg); border-color: transparent; }
.pill.est-borrador { color: var(--tenue); }
.pill.est-revisado { color: var(--acento); }
.pill.est-aprobado { color: var(--c-biologia); }
.ficha h2 { margin: 0; font-family: var(--f-lectura); font-weight: 600; font-size: 30px; line-height: 1.12; text-wrap: balance; letter-spacing: -0.01em; }
.fecha { font-family: var(--f-num); font-size: 13px; color: var(--tenue); margin-top: 6px; }
.lead { font-family: var(--f-lectura); font-size: 18px; line-height: 1.5; margin: 0; max-width: 62ch; }
.cols { display: grid; gap: 16px; }
@container (min-width: 500px) { .cols { grid-template-columns: 1fr 1fr; } }
.col h3, .bloque h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--tenue); font-weight: 600; }
.col { min-width: 0; }
.segun, .oficial { border-top: 2px solid var(--tinta); padding-top: 10px; font-family: var(--f-lectura); font-size: 15.5px; line-height: 1.55; }
.oficial { border-top-color: var(--linea); }
.segun + .segun { margin-top: 14px; }
.segun .quien { font-family: var(--f-ui); font-size: 13px; color: var(--tenue); margin-bottom: 4px; }
.segun .quien strong { color: var(--tinta); }
.segun p, .oficial p { margin: 0; }
.vacio { font-family: var(--f-ui); font-size: 13px; color: var(--tenue); border: 1px dashed var(--linea); border-radius: 6px; padding: 10px 12px; line-height: 1.45; }
.tj-s { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.sello, .discrepa { display: inline-block; font: 600 10.5px var(--f-ui); letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; }
.sello { color: var(--c-ciencia-saber); border: 1px solid currentColor; background: color-mix(in srgb, var(--c-ciencia-saber) 10%, transparent); }
.segun .sello { display: block; margin-top: 6px; font-size: 12px; font-weight: 500; letter-spacing: 0; border-radius: 6px; padding: 4px 8px; }
.discrepa { color: var(--aviso-tx); border: 1px dashed currentColor; }
.discrepa.grande { display: block; border-radius: 6px; padding: 6px 9px; margin-bottom: 8px; font-size: 12.5px; }
.disputa { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.contra { margin-top: 6px; font-family: var(--f-ui); font-size: 12px; color: var(--c-politica); }
.fuentes { list-style: none; padding: 0; margin: 8px 0 0; font-family: var(--f-ui); font-size: 13px; display: grid; gap: 4px; }
.fuentes a, .segun a { color: var(--acento); }
.cita { font-family: var(--f-lectura); font-size: 15px; }
.cita em { font-family: var(--f-ui); font-style: normal; font-size: 12px; }
.conex { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.conex button { width: 100%; text-align: left; display: grid; grid-template-columns: 10px 1fr; gap: 4px 10px; align-items: baseline;
  border: 1px solid var(--linea); border-radius: 6px; padding: 8px 10px; background: transparent; cursor: pointer; }
.conex button:hover { border-color: var(--tinta); }
.conex i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); align-self: center; }
.conex strong { font-weight: 600; }
.conex small { grid-column: 2; color: var(--tenue); font-size: 12.5px; }
.temas { display: flex; flex-wrap: wrap; gap: 6px; }
.bandeja h2 { font-size: 26px; }
.bandeja .grupo { display: flex; flex-direction: column; gap: 6px; }
.bandeja .grupo h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--tenue); font-weight: 600; }
.fuente { border-top: 2px solid var(--tinta); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.fuente h3 { margin: 0; font-family: var(--f-lectura); font-size: 20px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.fuente h3 a { color: inherit; text-decoration-color: var(--linea); text-underline-offset: 3px; }
.f-meta { font-family: var(--f-num); font-size: 12px; color: var(--tenue); }
.f-autores { font-size: 13px; font-weight: 600; }
.fuente p { margin: 0; font-family: var(--f-lectura); font-size: 15.5px; line-height: 1.55; max-width: 62ch; }
.fuente details summary { cursor: pointer; font-size: 13px; color: var(--acento); padding: 4px 0; }
.fuente details .conex { margin-top: 6px; }
.pend { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.fautor { font-family: var(--f-ui); font-size: 13px; color: var(--tenue); margin-top: 4px; }
.vacia-app { padding: 40px; font-size: 16px; }

@media (max-width: 760px) {
  .busca input { width: 130px; }
  .marca span { display: none; }
  .ficha { position: fixed; inset: 0; width: auto; z-index: 20; border-left: 0;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
}

<script>
(() => {
const D = window.CRONO;
if (!D) { document.querySelector(".app").innerHTML = '<p class="vacia-app">No se han podido cargar los datos (datos.js). Ejecuta herramientas/compilar.py y vuelve a publicar.</p>'; return; }

// ---------- Fechas: internamente año astronómico, en pantalla sin año 0 ----------
const fmt = y => y <= 0 ? `${1 - y} a.C.` : `${y}`;
function fmtFecha(f, persona, vivo) {
  const fe = f.fecha;
  if (!fe) return "Sin fecha";
  if (fe.texto) return fe.texto;
  const c = fe.aprox ? "c. " : "";
  if (fe.hasta == null) return persona && vivo ? `${c}${fmt(fe.desde)} –` : c + fmt(fe.desde);
  const ambosAC = fe.desde <= 0 && fe.hasta <= 0;
  const a = ambosAC ? `${1 - fe.desde}` : fmt(fe.desde);
  let s = `${c}${a} – ${fmt(fe.hasta)}`;
  if (persona) s += ` · ${fe.hasta - fe.desde} años`;
  return s;
}
const romano = n => { const t=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let s=""; for (const [v,r] of t) while (n>=v){s+=r;n-=v;} return s; };
// Siglo de un año astronómico: { n, ac, ini } (ini = primer año astronómico del siglo)
const siglo = y => y > 0 ? { n: Math.ceil(y / 100), ac: false, ini: Math.floor((y - 1) / 100) * 100 + 1 }
                         : { n: Math.ceil((1 - y) / 100), ac: true, ini: -Math.ceil((1 - y) / 100) * 100 + 1 };
const nomSiglo = s => `s. ${romano(s.n)}${s.ac ? " a.C." : ""}`;
const HOY = new Date().getFullYear();

const ERAS = [
  { n: "Prehistoria", d: -6000, h: -3000 },
  { n: "Edad Antigua", d: -3000, h: 476 },
  { n: "Edad Media", d: 476, h: 1492 },
  { n: "Edad Moderna", d: 1492, h: 1789 },
  { n: "Edad Contemporánea", d: 1789, h: HOY + 1 },
];

// ---------- Datos ----------
const NOMBRES_UI = { "politica-economia": "POLITIQUEO", "ciencia-saber": "CIENCIA", "religion": "RELIGIÓN" };
for (const c of D.carriles) if (NOMBRES_UI[c.id]) c.nombre = NOMBRES_UI[c.id];
const carriles = D.carriles;
const carrilDe = Object.fromEntries(carriles.map(c => [c.id, c]));
const color = id => `var(--c-${id})`;
const todas = D.fichas.map(f => f.fecha ? ({ ...f, ini: f.fecha.desde, fin: (f.fecha.hasta ?? (f.vivo ? HOY : f.fecha.desde)) }) : { ...f });
const fichas = todas.filter(f => f.fecha);
const sinFecha = todas.filter(f => !f.fecha);
const porId = Object.fromEntries(todas.map(f => [f.id, f]));
const autores = Object.fromEntries(D.autores.map(a => [a.id, a]));
const conex = Object.fromEntries(todas.map(f => [f.id, []]));
for (const f of todas) for (const c of (f.conexiones || [])) {
  if (!porId[c.id]) continue;
  if (!conex[f.id].some(x => x.id === c.id)) conex[f.id].push({ id: c.id, nota: c.nota });
  if (!conex[c.id].some(x => x.id === f.id)) conex[c.id].push({ id: f.id, nota: c.nota });
}
// Grupos de carriles = columnas de tarjetas, en el orden de carriles.json
const NOMBRE_NAT = {"gobiernos": "Gobiernos", "conflictos": "Conflictos", "ideales-sociales": "Ideales sociales", "banca": "Banca", "institutos": "Institutos", "filosofia": "Filosofía", "organizaciones": "Organizaciones", "teoria-alternativa": "Teoría alternativa", "ciencia": "Ciencia", "saber-ancestral": "Saber ancestral", "arquitecturas": "Arquitecturas", "documentos": "Documentos", "ocultismo": "Ocultismo", "logias": "Logias"};
const NOMBRE_GRUPO = { "politica-economia": "Política y economía", "ciencia-saber": "Ciencia y saber ancestral", religion: "Religión", personas: "Personas", humanidades: "Religión · política · sociedad", ciencia: "Ciencia y salud", pensamiento: "Filosofía y literatura", saberes: "Saberes tradicionales" };
const COLOR_GRUPO = { "politica-economia": "politica-economia", "ciencia-saber": "ciencia-saber", religion: "religion", personas: "personas", humanidades: "politica", ciencia: "fisica", pensamiento: "filosofia", saberes: "saberes" };
// Presentación en DOS columnas (14-11-2026). Los datos siguen con tres carriles (política y economía, ciencia, religión):
// solo se agrupan al dibujar. Cada tarjeta conserva el color de su carril.
const COLUMNAS = [
  { id: "historia-politica", nombre: "POLITIQUEO", colores: ["politica-economia"], carr: carriles.filter(c => c.id === "politica-economia").map(c => c.id) },
  { id: "ciencias-religion", nombre: "CIENCIA-RELIGIÓN", colores: ["ciencia-saber", "religion"], carr: carriles.filter(c => c.id !== "politica-economia" && c.id !== "personas").map(c => c.id) },
];
const grupos = COLUMNAS;

// ---------- Estado ----------
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } };
// Los carriles ocultos guardados que ya no existen (antes de los tres carriles) se descartan
const st = { ocultos: new Set(leer("crono.ocultos", []).filter(id => carrilDe[id])), autor: "", nat: "", q: "", sel: null, modo: leer("crono.modo", "detalle"), atras: [], cielo: leer("crono.cielo", true) };

const $ = id => document.getElementById(id);
const app = document.querySelector(".app"), transitosEl = $("transitos");
const escena = $("escena"), lienzo = $("lienzo"), cab = $("cab"), fondo = $("fondo"), vidaSel = $("vida-sel"), tarjEl = $("tarjetas"), svg = $("lineas"), ficha = $("ficha");
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const coincide = f => !st.q || (f.titulo + " " + f.resumen).toLowerCase().includes(st.q);
const deAutor = f => (!st.autor || (f.segun || []).some(s => s.autor === st.autor)) && (!st.nat || f.naturaleza === st.nat);
const corto = (t, n = 26) => t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t;

// ---------- Barra ----------
const sw = $("sw");
for (const c of carriles) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.style.setProperty("--c", color(c.id)); b.dataset.c = c.id;
  b.innerHTML = `<i></i>${esc(c.nombre)}`;
  b.setAttribute("aria-pressed", String(!st.ocultos.has(c.id)));
  b.onclick = () => { st.ocultos.has(c.id) ? st.ocultos.delete(c.id) : st.ocultos.add(c.id);
    b.setAttribute("aria-pressed", String(!st.ocultos.has(c.id))); guardar("crono.ocultos", [...st.ocultos]); maquetar(true); };
  sw.appendChild(b);
}
const selAutor = $("autor");
selAutor.innerHTML = `<option value="">Todos los autores</option>` + D.autores.map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join("");
selAutor.onchange = () => { st.autor = selAutor.value; pintar(); };

$("buscar").oninput = e => { st.q = e.target.value.trim().toLowerCase(); pintar(); };
$("buscar").onkeydown = e => { if (e.key === "Enter") { const f = fichas.find(f => coincide(f) && deAutor(f) && !st.ocultos.has(f.carril)); if (f) ir(f.id); } };
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { st.modo = b.dataset.modo; guardar("crono.modo", st.modo); maquetar(true); });
// Capa «Cielo»: franja de ciclos y panel de paralelos (solo si datos.js trae D.cielo)
const CIELO = D.cielo || null;
if (!CIELO) $("cielo-b").parentElement.hidden = true;
$("cielo-b").onclick = () => { st.cielo = !st.cielo; guardar("crono.cielo", st.cielo); maquetar(true); };
$("rueda-b").onclick = () => abrirRueda();
$("paral-b").onclick = () => abrirParalelos();
$("matriz-b").onclick = () => abrirMatriz();
$("trans-b").onclick = () => abrirTransitos();

const nPrueba = todas.filter(f => f.estado === "prueba").length;

// ---------- Franja feed: fichas reales con fecha, al azar, una cada pocos segundos ----------
(() => {
  const el = $("feed"); if (!el) return;
  const caps = [...el.children]; let k = 0, actual = null, id = null;
  const pool = fichas.filter(f => carrilDe[f.carril] && f.carril !== "personas" && f.titulo);
  if (!pool.length) { el.hidden = true; return; }
  const sig = () => {
    const f = pool[Math.floor(Math.random() * pool.length)];
    const nuevo = caps[k ^ 1], viejo = caps[k]; k ^= 1;
    const s0 = (f.segun || [])[0], au = s0 && autores[s0.autor] ? autores[s0.autor].nombre : "";
    nuevo.innerHTML = `<b>${esc(f.titulo.replace(/[.\s]+$/, ""))}. <span class="m">(${esc(fmtFecha(f))} · ${esc(carrilDe[f.carril].nombre)})</span></b>`;
    nuevo.classList.add("on"); viejo.classList.remove("on"); id = f.id;
  };
  el.onclick = () => { if (id) ir(id); };
  sig(); setInterval(sig, 4000);
})();

const obras = [];
for (const a of D.autores) for (const o of (a.obras || [])) {
  const clave = o.url || `${a.id}/${o.id}`;
  let x = obras.find(y => y.clave === clave);
  if (!x) { x = { clave, ...o, autores: [], refs: [] }; obras.push(x); }
  if (!x.autores.includes(a.nombre)) x.autores.push(a.nombre);
  x.refs.push(`${a.id}/${o.id}`);
}
const fichasDeObra = x => todas.filter(f => (f.segun || []).some(s => x.refs.includes(`${s.autor}/${s.obra}`)));
const procesadas = obras.filter(o => o.estado === "procesada");

if (!nPrueba && !leer("crono.pista-eje", false)) { const a = $("aviso"); a.hidden = false;
  a.innerHTML = `Las personas ya no se dibujan como barras: pasa el ratón por el eje de años (o tócalo) para ver quién vivía en cada momento. Al abrir una persona, su vida se marca en el eje.<button type="button" id="aviso-ok">Entendido</button>`;
  $("aviso-ok").onclick = () => { a.hidden = true; guardar("crono.pista-eje", true); maquetar(true); }; }
if (nPrueba) { const a = $("aviso"); a.hidden = false;
  a.textContent = `Datos de prueba (${nPrueba} fichas, borde discontinuo): solo llevan la versión oficial y ningún autor todavía.`; }

// ---------- Tarjetas (DOM, se crean una vez) ----------
// Versión oficial en la tarjeta: siempre presente, plegada; se despliega sin abrir la ficha
function oficialTarjeta(f) {
  const of = f.oficial;
  if (!(of && of.resumen)) {
    return `<div class="tj-o falta">Versión oficial: pendiente</div>`;
  }
  const fs = (of.fuentes || []).map(x => x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titulo)}</a>` : esc(x.titulo)).join(" · ");
  const conFuente = !!(of.fuentes || []).length;
  return `<details class="tj-o${conFuente ? "" : " sinfuente"}"><summary>Versión oficial${conFuente ? " ✓" : " · sin fuente"}</summary><p>${esc(of.resumen)}</p>${fs ? `<span class="tj-of">Fuente: ${fs}</span>` : `<span class="tj-of sin">Pendiente de documentar: no se publica así.</span>`}</details>`;
}
// Sello de coincidencia (REGLAS §2.5) y aviso de discrepancia (§2.3)
function coincidencias(f) {
  const segun = f.segun || [], vistos = new Set(), out = [];
  for (const s of segun) for (const a of s.coincide || []) if (!vistos.has(a)) {
    vistos.add(a);
    const e = segun.find(x => x.autor === a), au = autores[a];
    out.push({ nombre: au?.nombre || a, obra: e ? (au?.obras?.find(o => o.id === e.obra)?.titulo || e.obra) : "" });
  }
  return out;
}
const discrepan = f => (f.segun || []).some(s => (s.contradice || []).length);
function sellosTarjeta(f) {
  const co = coincidencias(f), di = discrepan(f);
  if (!co.length && !di) return "";
  return `<span class="tj-s">${co.map(c => `<span class="sello">Coincide con ${esc(c.nombre)}</span>`).join("")}${di ? `<span class="discrepa">Estos autores discrepan</span>` : ""}</span>`;
}
const nodos = {};
for (const f of fichas) {
  const persona = f.tipo === "persona";
  const el = document.createElement("article");
  el.className = `tj${f.estado === "prueba" ? " prueba" : ""}`;
  el.style.setProperty("--c", color(f.carril));
  el.dataset.id = f.id;
  const cx = conex[f.id];
  const nAut = new Set((f.segun || []).map(s => s.autor)).size;
  el.innerHTML = `<button type="button" class="tj-a">
      <span class="tj-m"><span>${esc(fmtFecha(f, false, f.vivo))}</span><span class="k"><span class="kc">${esc(carrilDe[f.carril]?.nombre || f.carril)}</span>${f.naturaleza ? `<span class="nat">${esc(NOMBRE_NAT[f.naturaleza] || f.naturaleza)}</span>` : ""}${nAut > 1 ? `<span class="na">${nAut} autores</span>` : ""}</span></span>
      <span class="tj-t">${esc(f.titulo)}</span>
      <span class="tj-r">${esc(f.resumen)}</span>${sellosTarjeta(f)}
    </button>` + oficialTarjeta(f) +
    (cx.length ? `<div class="tj-x">${cx.slice(0, 3).map(k => { const o = porId[k.id];
      return `<button type="button" data-ir="${o.id}" style="--c:${color(o.carril)}" title="${esc(o.titulo)}${k.nota ? " — " + esc(k.nota) : ""}"><i></i><span>${esc(corto(o.titulo))}</span></button>`; }).join("")}${cx.length > 3 ? `<button type="button" class="mas" data-abrir="1">+${cx.length - 3}</button>` : ""}</div>` : "");
  el.querySelector(".tj-a").onclick = () => seleccionar(f.id);
  const det = el.querySelector("details.tj-o"); if (det) det.addEventListener("toggle", () => maquetar(true));
  el.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => ir(b.dataset.ir, f.id));
  const mas = el.querySelector("[data-abrir]"); if (mas) mas.onclick = () => seleccionar(f.id);
  tarjEl.appendChild(el); nodos[f.id] = el;
}

// ---------- Maquetación vertical ----------
// La altura de cada década = lo que ocupan las tarjetas de su columna más llena. Décadas vacías: 3 px;
// tramos vacíos largos (≥ 150 años) se comprimen en un hueco rotulado.
let anchoPrev = 0;
let L = null;   // última maquetación: { dec0, tops, alturas, T, inv, alto }
function maquetar(conservar) {
  const anclaAño = conservar && L ? L.inv(escena.scrollTop) : null;
  if (L) ocultarLupa();   // la maquetación cambia las posiciones: la lupa se cierra
  document.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.modo === st.modo)));
  lienzo.classList.toggle("compacto", st.modo === "compacto");

  const W = escena.clientWidth;
  // Las personas no ocupan columna (REGLAS §8): van en la franja de vidas, con el color de su carril.
  const vis = fichas.filter(f => !st.ocultos.has(f.carril));
  const visT = vis.filter(f => f.tipo !== "persona");
  const personas = vis.filter(f => f.tipo === "persona").sort((a, b) => a.ini - b.ini);
  // Una sola columna si no caben las columnas por carril con un ancho legible (móvil, o ficha abierta en pantalla mediana)
  const gs = grupos.filter(g => g.carr.some(c => !st.ocultos.has(c)));
  const estrecho = W < 480 || (W - 100) / Math.max(1, gs.length) < 150;
  const cols = estrecho ? [{ id: "todo", carr: carriles.map(c => c.id) }] : gs;
  const colDe = {}; for (const [i, g] of cols.entries()) for (const c of g.carr) colDe[c] = i;

  // Personas (REGLAS §8, 2026-11-12): sin barras ni tarjetas. El eje de años hace de lupa: al pasar el ratón
  // o tocarlo salen quienes vivían ese año; al elegir una persona, su vida se marca sobre el eje.
  const ejeW = estrecho ? 58 : 76, gap = estrecho ? 0 : 10, derecha = estrecho ? 8 : 14;
  const zonas = [{ x: 0, w: ejeW }];
  // Franja «Cielo» entre el eje y las columnas: una pista por par de planetas
  const verCielo = !!(CIELO && st.cielo);
  const pares = verCielo ? [...new Set(CIELO.ciclos.map(k => k.par))] : [];
  const pista = estrecho ? 6 : 9, cieloX = ejeW + 6, cieloW = verCielo ? pares.length * pista + 6 : 0;
  const x0 = ejeW + 8 + cieloW;
  const colW = Math.max(140, (W - x0 - derecha - gap * (cols.length - 1)) / cols.length);
  const xCol = cols.map((g, i) => x0 + i * (colW + gap));

  // Tarjetas: ancho, visibilidad y medida (las personas no tienen tarjeta en columna)
  // En columnas de un solo carril visible no hace falta repetir el nombre del carril en cada tarjeta
  const soloCol = cols.map(g => g.carr.filter(c => !st.ocultos.has(c)).length === 1);
  for (const f of fichas) { const el = nodos[f.id]; const on = f.tipo !== "persona" && !st.ocultos.has(f.carril); el.hidden = !on;
    if (on) { el.style.width = `${colW}px`; el.classList.toggle("solo", soloCol[colDe[f.carril]]); } }
  const alto = {}; for (const f of visT) alto[f.id] = nodos[f.id].offsetHeight;

  // Décadas
  const GAP = 6;
  const minY = Math.min(...fichas.map(f => f.ini)), maxY = Math.max(HOY, ...fichas.map(f => f.fin));

  for (let i = 0; i < nd;) {

    let j = i; while (j < nd && alturas[j] <= 3) j++;

  // Fondo: eras, siglos, décadas, huecos

  h += `<div class="eje-l" style="left:${ejeW}px"></div>`;
  const enHueco = d => huecos.some(([i, j]) => d - dec0 >= i && d - dec0 < j);

}

function rellenarIrA(vis) {

$("ira").onchange = e => { const v = e.target.value; if (v === "") return; desplazarA(L.T(+v) - 8); e.target.value = ""; };

// Indicador de siglo/década visibles arriba

// ---------- Pintado: selección, filtros, líneas ----------
function pintar() {

  marcarVida();

// Vida de una persona marcada sobre el eje: la elegida o, mientras se señala en la lupa, esa

// ---------- Lupa: quién vivía en el año que señala el ratón (o el dedo) sobre el eje ----------

    const f = porId[id]; if (!L || !f.fecha) return;

// ---------- Matriz de autores (2026-11-18): quién firma qué siglo y dónde chocan ----------
function grafoTemporal(auts) {
  const Y0 = 1400, W = 1000, GUT = 150, PAD = 12, TOP = 30, LH = 36;
  const conFecha = todas.filter(f => f.fecha && typeof f.ini === "number");
  const yMax = Math.max(2030, ...conFecha.map(f => f.ini));
  const dentro = conFecha.filter(f => f.ini >= Y0);
  const ancho = W - GUT - PAD;
  const X = y => GUT + (y - Y0) / (yMax - Y0) * ancho;
  const centro = {}, cuenta = {};
  auts.forEach((a, i) => { centro[a.id] = TOP + i * LH + LH / 2; cuenta[a.id] = 0; });
  const paso = ancho / ((yMax - Y0) / 10);
  const anchoCel = Math.max(4, paso - 1.2);
  const dec = y => Math.floor(y / 10) * 10;
  const celdas = {}, arcos = [];
  dentro.forEach(f => {
    const autsF = [...new Set((f.segun || []).map(s => s.autor))]
      .filter(id => centro[id] !== undefined).sort((a, b) => centro[a] - centro[b]);
    autsF.forEach(id => {
      const k = id + "|" + dec(f.ini);
      if (!celdas[k]) celdas[k] = { a: id, d: dec(f.ini), ids: [] };
      celdas[k].ids.push(f.id);
      cuenta[id]++;
    });
    const contra = (f.segun || []).some(s => (s.contradice || []).length);
    const coincide = (f.segun || []).some(s => (s.coincide || []).length);
    for (let i = 1; i < autsF.length; i++) {
      arcos.push({
        x: X(f.ini), ya: centro[autsF[i - 1]], yb: centro[autsF[i]], contra, coincide, id: f.id,
        t: `${fmtFecha(f)} · ${f.titulo} · ${autsF.map(a => autores[a].nombre).join(" + ")}`
      });
    }
  });
  const maxC = Math.max(1, ...Object.values(celdas).map(c => c.ids.length));
  const eje = [];
  for (let y = 1400; y <= yMax; y += 100) {
    eje.push(`<line x1="${X(y).toFixed(1)}" y1="${TOP - 6}" x2="${X(y).toFixed(1)}" y2="${TOP + auts.length * LH - 10}" stroke="var(--linea)" stroke-width=".6"/>`
      + `<text x="${X(y).toFixed(1)}" y="${TOP - 11}" text-anchor="middle">${y}</text>`);
  }
  const bandas = auts.map(a => {
    const y = centro[a.id];
    return `<rect x="${GUT}" y="${y - LH / 2 + 3}" width="${ancho}" height="${LH - 6}" fill="var(--linea)" opacity=".14" rx="3"/>`
      + `<text x="0" y="${y + 3}" class="tg-n">${esc(a.nombre)}</text>`
      + `<text x="0" y="${y + 15}" class="tg-sub">${cuenta[a.id]} ficha(s) desde 1400</text>`;
  }).join("");
  const marcas = Object.values(celdas).map(c => {
    const alfa = (0.14 + 0.76 * c.ids.length / maxC).toFixed(2);
    return `<rect class="tg-mark" data-tg="${c.ids.join(",")}" x="${(X(c.d) + 0.6).toFixed(1)}" y="${centro[c.a] - 9}" width="${anchoCel.toFixed(1)}" height="18" rx="2" fill="var(--tinta)" opacity="${alfa}"><title>${esc(autores[c.a].nombre)} · ${c.d}s · ${c.ids.length} ficha(s)</title></rect>`;
  }).join("");
  const lineas = arcos.map(a => {
    const col = a.contra ? "#c0392b" : a.coincide ? "#2e7d32" : "var(--tenue)";
    return `<path class="tg-arco" data-tg="${a.id}" d="M${a.x.toFixed(1)} ${a.ya} Q${(a.x + 16).toFixed(1)} ${(a.ya + a.yb) / 2} ${a.x.toFixed(1)} ${a.yb}" stroke="${col}"><title>${esc(a.t)}</title></path>`;
  }).join("");
  const alto = TOP + auts.length * LH + 10;
  return `<svg class="tg" viewBox="0 0 ${W} ${alto}" role="img" aria-label="Cuándo firma cada autor y con quién">${eje.join("")}${bandas}${lineas}${marcas}</svg>`;
}

function abrirMatriz() {
  st.sel = null; history.replaceState(null, "", location.pathname + location.search);
  const auts = Object.values(autores);
  const conAutor = todas.filter(f => (f.segun || []).length);
  const conFecha = conAutor.filter(f => f.fecha);
  const siglo = y => Math.floor(y / 100) * 100;
  const etiqueta = s => s >= 0 ? `${s}` : `${-s} a.C.`;
  if (!conAutor.length) {
    abrirPanel(`<div class="ficha-in bandeja"><div class="ficha-top"><span class="pill">Matriz de autores</span><button type="button" class="cerrar" id="cerrar">Cerrar</button></div><div class="vacio">No hay fichas con autor.</div></div>`);
    return;
  }
  const siglos = conFecha.map(f => siglo(f.ini));
  const min = Math.min(...siglos), max = Math.max(...siglos);
  const cols = []; for (let s = min; s <= max; s += 100) cols.push(s);
  const filasCols = [...cols, "sin"];
  const celda = {};
  auts.forEach(a => filasCols.forEach(c => celda[a.id + "|" + c] = { n: 0, contra: 0, coinc: 0, ids: [] }));
  conAutor.forEach(f => {
    const c = f.fecha ? siglo(f.ini) : "sin";
    (f.segun || []).forEach(s => {
      const k = s.autor + "|" + c; if (!celda[k]) return;
      celda[k].n++; celda[k].ids.push(f.id);
      if ((s.contradice || []).length) celda[k].contra++;
      if ((s.coincide || []).length) celda[k].coinc++;
    });
  });
  const maxN = Math.max(1, ...Object.values(celda).map(c => c.n));
  const filas = filasCols.map(c => `<tr><th scope="row">${c === "sin" ? "Sin fecha" : etiqueta(c)}</th>${auts.map(a => {
    const d = celda[a.id + "|" + c];
    if (!d.n) return `<td><span class="cero" title="Sin fichas de ${esc(a.nombre)} en ${c === "sin" ? "sin fecha" : etiqueta(c)}">·</span></td>`;
    const alfa = (0.12 + 0.88 * d.n / maxN).toFixed(2);
    return `<td><button type="button" class="cel" data-matriz="${a.id}|${c}" style="background:rgba(128,130,140,${alfa})" title="${esc(a.nombre)} · ${etiqueta(c)} · ${d.n} ficha(s)${d.contra ? ` · ${d.contra} con contradicción` : ""}${d.coinc ? ` · ${d.coinc} coincidencia(s)` : ""}"><span>${d.n}</span>${d.contra ? '<i class="choca" aria-hidden="true"></i>' : ""}${d.coinc ? '<i class="coinc" aria-hidden="true"></i>' : ""}</button></td>`;
  }).join("")}</tr>`).join("");
  const cabecera = auts.map(a => `<th scope="col" title="${esc(a.nombre)}">${esc(a.nombre.split(" ")[0])}</th>`).join("");

  const solapa = {}, choca = {};
  auts.forEach(a => auts.forEach(b => { solapa[a.id + "|" + b.id] = 0; choca[a.id + "|" + b.id] = 0; }));
  conAutor.forEach(f => {
    const ids = [...new Set((f.segun || []).map(s => s.autor))].filter(x => autores[x]);
    ids.forEach(a => ids.forEach(b => { if (a !== b) solapa[a + "|" + b]++; }));
    (f.segun || []).forEach(s => (s.contradice || []).forEach(b => {
      if (autores[s.autor] && autores[b]) { choca[s.autor + "|" + b]++; choca[b + "|" + s.autor]++; }
    }));
  });
  const maxSol = Math.max(1, ...Object.values(solapa));
  const conContra = conAutor.filter(f => (f.segun || []).some(s => (s.contradice || []).length)).length;
  const conCoinc = new Set(conAutor.filter(f => (f.segun || []).some(s => (s.coincide || []).length)).map(f => f.id)).size;
  const svgTemporal = grafoTemporal(auts);
  const pre1400 = todas.filter(f => f.fecha && typeof f.ini === "number" && f.ini < 1400).length;
  const sinFecha = todas.filter(f => !f.fecha).length;

  // Huecos: fichas por siglo y carril (todas las fichas, no solo las firmadas)
  const porSiglo = {};
  carriles.forEach(c => { porSiglo[c.id] = {}; filasCols.forEach(s => porSiglo[c.id][s] = 0); });
  todas.forEach(f => {
    const s = f.fecha ? siglo(f.ini) : "sin";
    if (porSiglo[f.carril] && porSiglo[f.carril][s] !== undefined) porSiglo[f.carril][s]++;
  });
  const maxH = Math.max(1, ...carriles.flatMap(c => filasCols.map(s => porSiglo[c.id][s])));
  const filasHuecos = filasCols.map(s => `<tr><th scope="row">${s === "sin" ? "Sin fecha" : etiqueta(s)}</th>${carriles.map(c => {
    const n = porSiglo[c.id][s];
    if (!n) return `<td><span class="cero" title="Sin fichas en ${esc(c.nombre)} · ${s === "sin" ? "sin fecha" : etiqueta(s)}">·</span></td>`;
    const alfa = (0.12 + 0.88 * n / maxH).toFixed(2);
    return `<td><span class="cel" style="background:rgba(128,130,140,${alfa});cursor:default" title="${esc(c.nombre)} · ${s === "sin" ? "sin fecha" : etiqueta(s)} · ${n} ficha(s)"><span>${n}</span></span></td>`;
  }).join("")}</tr>`).join("");
  const filas2 = auts.map(a => `<tr><th scope="row">${esc(a.nombre)}</th>${auts.map(b => {
    if (a.id === b.id) return `<td><span class="cero">—</span></td>`;
    const n = solapa[a.id + "|" + b.id], x = choca[a.id + "|" + b.id];
    if (!n) return `<td><span class="cero" title="${esc(a.nombre)} y ${esc(b.nombre)} no coinciden en ninguna ficha">·</span></td>`;
    const alfa = (0.12 + 0.88 * n / maxSol).toFixed(2);
    return `<td><button type="button" class="cel" data-par="${a.id}|${b.id}" style="background:rgba(128,130,140,${alfa})" title="${esc(a.nombre)} y ${esc(b.nombre)}: ${n} ficha(s)${x ? `, ${x} contradicción(es)` : ""}"><span>${n}</span>${x ? '<i class="choca" aria-hidden="true"></i>' : ""}</button></td>`;
  }).join("")}</tr>`).join("");

  abrirPanel(`<div class="ficha-in bandeja">
    <div class="ficha-top"><span class="pill">Matriz de autores</span><button type="button" class="cerrar" id="cerrar">Cerrar</button></div>
    <div><h2>Quién firma qué</h2><p class="fautor">Cada fila, un siglo (la última, las fichas sin fecha); cada columna, un autor. La intensidad es el número de fichas que firma ahí; el punto rojo, que alguna de esas fichas contradice a otro autor. Un punto es un siglo que ese autor no toca. Pulsa una celda para ver las fichas.</p></div>

      <div class="matriz-scroll"><table class="matriz"><thead><tr><th></th>${cabecera}</tr></thead><tbody>${filas}</tbody></table></div>
      <div id="matriz-detalle" class="matriz-detalle"></div>
    </section>
    <section class="bloque"><h3>Solapamiento entre autores</h3>
      <p class="fautor">Fichas que firman dos autores a la vez. En rojo, cuántas veces uno contradice al otro: lo que la web hoy solo dice abriendo cada ficha.</p>
      <div class="matriz-scroll"><table class="matriz"><thead><tr><th></th>${auts.map(a => `<th scope="col">${esc(a.nombre.split(" ")[0])}</th>`).join("")}</tr></thead><tbody>${filas2}</tbody></table></div>
      <div id="matriz-detalle2" class="matriz-detalle"></div>
    </section>
    <section class="bloque"><h3>Huecos por carril</h3>
      <p class="fautor">Fichas por siglo y carril. Donde no hay número no hay ficha: el hueco también es información.</p>
      <div class="matriz-scroll"><table class="matriz"><thead><tr><th></th>${carriles.map(c => `<th scope="col">${esc(NOMBRES_UI[c.id] || c.nombre)}</th>`).join("")}</tr></thead><tbody>${filasHuecos}</tbody></table></div>
    </section>
    <section class="bloque"><h3>Cuándo firma cada autor</h3>
      <p class="fautor">Cada franja es un autor y cada columna una década; cuanto más oscura, más fichas firma ahí. La línea cruza a dos autores cuando firman la misma ficha: el tiempo deja de ser una tabla y se ve dónde se encuentran.</p>
      <div class="leyenda-tg"><span><i class="celda"></i>fichas firmadas por década</span><span><i class="roja"></i>se contradicen</span><span><i class="verde"></i>coincide un autor de ciencia</span><span><i></i>solo se solapan</span></div>
      <div class="matriz-scroll">${svgTemporal}</div>
      <div id="matriz-detalle3" class="matriz-detalle"></div>
      <p class="nota">La escala empieza en 1400: quedan fuera ${pre1400} ficha(s) anteriores y ${sinFecha} sin fecha, que están en la tabla de arriba. Un hueco horizontal es un autor que no firma nada en esa época; la raya vertical, que el corpus se concentra.</p>

  ficha.querySelectorAll("[data-matriz]").forEach(b => b.onclick = () => {
    const [au, c] = b.dataset.matriz.split("|");
    const d = celda[au + "|" + c];

    $("matriz-detalle").innerHTML = `<h4>${esc(autores[au].nombre)} · ${cuando} · ${d.n} ficha(s)</h4>` + listaFichas(d.ids) + (d.contra ? `<p class="nota">${d.contra} de ellas con contradicción a otro autor.</p>` : "");
  });
  ficha.querySelectorAll("[data-tg]").forEach(b => b.onclick = () => {
    const ids = b.dataset.tg.split(",");
    $("matriz-detalle3").innerHTML = `<h4>${ids.length} ficha(s) en esa marca</h4>` + listaFichas(ids);
  });
  ficha.querySelectorAll("[data-par]").forEach(b => b.onclick = () => {
    const [a, b2] = b.dataset.par.split("|");
    const ids = conAutor.filter(f => (f.segun || []).some(s => s.autor === a) && (f.segun || []).some(s => s.autor === b2)).map(f => f.id);
    $("matriz-detalle2").innerHTML = `<h4>${esc(autores[a].nombre)} · ${esc(autores[b2].nombre)} · ${ids.length} ficha(s)</h4>` + listaFichas(ids);
  });
}

// ---------- Mapa del cielo (2026-11-18): planetas y estrellas fijas, calculados ----------
const SIGNOS_R = ["Ari", "Tau", "Gem", "Can", "Leo", "Vir", "Lib", "Esc", "Sag", "Cap", "Acu", "Pis"];
const COLOR_PLANETA = { Sol: "#c9962a", Luna: "#8d99a6", Mercurio: "#8a6fb0", Venus: "#3f8f6f", Marte: "#b0462d",
                        "Júpiter": "#a87a2a", Saturno: "#6b5a3e", Urano: "#2b68ad", Neptuno: "#2a6f8f", "Plutón": "#7a3b52" };

function ruedaHTML(pos, jd) {
  const C = 320, R1 = 268, R2 = 236, RE = 212, RP = 168;
  const P = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  let s = `<svg class="rueda" viewBox="0 0 640 640" role="img" aria-label="Mapa del cielo">`;
  s += `<circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="var(--linea)"/>`;
  s += `<circle cx="${C}" cy="${C}" r="${R2}" fill="none" stroke="var(--linea)"/>`;
  for (let i = 0; i < 12; i++) {
    const [x, y] = P(i * 30, R1), [x2, y2] = P(i * 30, R2);
    s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--linea)" opacity=".8"/>`;
    const [lx, ly] = P(i * 30 + 15, (R1 + R2) / 2);
    s += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" class="rueda-signo">${SIGNOS_R[i]}</text>`;
  }
  for (const e of MOTOR.ESTRELLAS) {
    const lon = MOTOR.longitudEstrella(e, jd);
    const [x, y] = P(lon, RE);
    const r = Math.max(1, 3 - e.mag * 0.55);
    const rob = MOTOR.robsonDe(e);
    const t = `${e.nombre} · mag ${e.mag} · ${MOTOR.signo(lon)}${rob && rob.naturaleza ? " · " + rob.naturaleza : ""}`;
    s += `<circle class="rueda-est" data-est="${MOTOR.ESTRELLAS.indexOf(e)}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--tenue)" opacity="${Math.min(1, 0.45 + 0.55 * (3 - e.mag) / 4).toFixed(2)}"><title>${esc(t)}</title></circle>`;
  }
  for (const [n, lon] of Object.entries(pos)) {
    const [x, y] = P(lon, RP);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${COLOR_PLANETA[n] || "var(--tinta)"}"/>`;
    const [tx, ty] = P(lon, RP - 14);
    s += `<text x="${tx.toFixed(1)}" y="${(ty + 4).toFixed(1)}" text-anchor="middle" class="rueda-planeta-n">${esc(n.slice(0, 3))}</text>`;
  }
  const [nx, ny] = P(0, 0);
  s += `<circle cx="${nx}" cy="${ny}" r="3" fill="var(--tenue)"/>`;
  return s + `</svg>`;
}

  pintarRueda();

// ---------- Estrellas y sus tránsitos (2026-11-18): ¿cuándo estuvo Saturno sobre Regulus? ----------
// Se calcula al pulsar, para una estrella o un planeta elegidos, 1885-2026, paso de 1 día a
// 12:00 UTC. No se precarga nada: 178 estrellas por 140 años cuelga el navegador.
// Barrido: se mira el planeta cada pocos días y solo se baja a día a día donde podría haber
// tránsito (margen = orbe + velocidad máxima del planeta × paso), así que no se salta ninguno.
const TR_CUERPOS = ["Sol", "Mercurio", "Venus", "Marte", "Júpiter", "Saturno", "Urano", "Neptuno", "Plutón"];
const TR_VMAX = { Sol: 1.05, Mercurio: 2.4, Venus: 1.35, Marte: 0.9, "Júpiter": 0.26, Saturno: 0.14, Urano: 0.07, Neptuno: 0.04, "Plutón": 0.05 }; // grados/día, con holgura
const TR_PASO = { Sol: 4, Mercurio: 4, Venus: 4, Marte: 6, "Júpiter": 10, Saturno: 10, Urano: 15, Neptuno: 15, "Plutón": 15 };
const TR_ES = { Sun: "Sol", Mercury: "Mercurio", Venus: "Venus", Mars: "Marte", Jupiter: "Júpiter", Saturn: "Saturno" };
const trNatDe = rob => {
  if (!rob || !rob.naturaleza) return null;
  const s = new Set(); for (const [en, es] of Object.entries(TR_ES)) if (new RegExp("\\b" + en + "\\b").test(rob.naturaleza)) s.add(es);
  return s.size ? s : null;
};
const trFecha = jd => { const [y, m, d] = MOTOR.fechaDesdeJd(jd); return `${y}-${String(m).padStart(2, "0")}-${String(Math.floor(d)).padStart(2, "0")}`; };
const trSep = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
let trTurno = 0;

function abrirTransitos() {
  if (!window.MOTOR || !MOTOR.longitudCuerpo) { alert("El motor del cielo no está cargado (cielo-datos.js y cielo.js)."); return; }
  st.sel = null; history.replaceState(null, "", location.pathname + location.search);
  const est = MOTOR.ESTRELLAS.map((e, i) => ({ e, i, rob: MOTOR.robsonDe(e) })).sort((a, b) => a.e.nombre.localeCompare(b.e.nombre));
  const reg = est.find(x => x.e.nombre === "Regulus");
  abrirPanel(`<div class="ficha-in bandeja">
    <div class="ficha-top"><span class="pill">Estrellas · tránsitos · calculado</span><button type="button" class="cerrar" id="cerrar">Cerrar</button></div>
    <div><h2>¿Cuándo estuvo un planeta sobre una estrella?</h2><p class="fautor">Elige una estrella (y uno o todos los planetas) o un planeta (sobre todas las estrellas). Se calcula aquí, día a día de 1885 a 2026 a 12:00 UTC, con el mismo motor que la Rueda. Cada paso enlaza las fichas de esos años. Sin Luna: ninguna ficha da la hora.</p></div>
    <div class="rueda-controles">
      <label>Estrella<select id="t-est"><option value="">— todas (planeta elegido) —</option>${est.map(x => `<option value="${x.i}"${reg && x.i === reg.i ? " selected" : ""}>${esc(x.e.nombre)} · mag ${x.e.mag}${x.rob && x.rob.naturaleza ? " · " + esc(x.rob.naturaleza) : ""}</option>`).join("")}</select></label>
      <label>Planeta<select id="t-pla"><option value="">— todos —</option>${TR_CUERPOS.map(c => `<option${c === "Saturno" ? " selected" : ""}>${c}</option>`).join("")}</select></label>
      <label>Orbe °<input id="t-orbe" type="number" min="0.1" max="3" step="0.1" value="1"></label>
      <button type="button" class="pill" id="t-ir">Calcular</button>
    </div>
    <div id="t-estado" class="nota"></div>
    <div id="t-robson"></div>
    <div id="t-tabla"></div>
    <p class="nota">Un paso es la racha de días seguidos dentro del orbe; con la retrogradación un planeta lento puede pasar tres veces. «Misma naturaleza» = el planeta está entre los que Robson nombra para la estrella. Robson solo aparece si su entrada se pudo emparejar con seguridad (42 de 178 estrellas); si no, se dice. Hechos con día: los de PAR-001, con fecha exacta dentro del paso.</p>
  </div>`);
  $("t-ir").onclick = calcularTransitos;
  calcularTransitos();
}

function calcularTransitos() {
  const turno = ++trTurno;
  const iE = $("t-est").value, pla = $("t-pla").value;
  const orbe = Math.max(0.1, Math.min(3, +$("t-orbe").value || 1));
  if (iE === "" && !pla) { $("t-estado").textContent = "Elige al menos una estrella o un planeta: las 178 estrellas con todos los planetas a la vez cuelgan la página."; $("t-tabla").innerHTML = ""; $("t-robson").innerHTML = ""; return; }
  const estrellas = iE === "" ? MOTOR.ESTRELLAS : [MOTOR.ESTRELLAS[+iE]];
  const cuerpos = pla ? [pla] : TR_CUERPOS;
  if (iE !== "") {
    const e = estrellas[0], rob = MOTOR.robsonDe(e);
    $("t-robson").innerHTML = `<div class="matriz-detalle"><h4>${esc(e.nombre)} · mag ${e.mag} · hoy en ${MOTOR.signo(MOTOR.longitudEstrella(e, MOTOR.jdDesdeFecha(2026, 1, 1, 12)))}</h4>`
      + (rob ? `<p><b>Robson, ${esc(rob.nombre)}</b>${rob.naturaleza ? ` · naturaleza: ${esc(rob.naturaleza)}` : " · sin naturaleza escrita"}</p><p style="font-family:var(--f-lectura);font-size:13.5px;line-height:1.45">${esc(rob.influencia)}</p>`
             : `<p class="nota">Esta estrella no está entre las entradas del libro de Robson que se pudieron leer y emparejar. No se rellena.</p>`) + `</div>`;
  } else $("t-robson").innerHTML = "";
  const jd0 = MOTOR.jdDesdeFecha(1885, 1, 1, 12), jd1 = MOTOR.jdDesdeFecha(2026, 12, 31, 12);
  const datosEst = estrellas.map(e => ({ e, rob: MOTOR.robsonDe(e), cache: {} }));
  const lonAnual = (x, y) => x.cache[y] ?? (x.cache[y] = MOTOR.longitudEstrella(x.e, MOTOR.jdDesdeFecha(y, 7, 1, 12)));
  const pasos = [];
  const tareas = cuerpos.map(c => ({ c, jd: jd0, abiertos: new Map() }));
  let it = 0;
  const lonDia = (c, jd) => { const [y, m] = MOTOR.fechaDesdeJd(jd); return MOTOR.longitudCuerpo(c, jd, y, m); };
  const cerrar = (t, k) => { const p = t.abiertos.get(k); if (p) { pasos.push(p); t.abiertos.delete(k); } };
  function trozo() {
    if (turno !== trTurno) return;
    const fin = performance.now() + 40;
    while (it < tareas.length && performance.now() < fin) {
      const t = tareas[it], v = TR_VMAX[t.c], s = TR_PASO[t.c];
      if (t.jd > jd1) { for (const k of [...t.abiertos.keys()]) cerrar(t, k); it++; continue; }
      const [y, m] = MOTOR.fechaDesdeJd(t.jd);
      const lon = t.sig != null ? t.sig : MOTOR.longitudCuerpo(t.c, t.jd, y, m);
      if (lon == null) { t.sig = null; t.jd += s; continue; }
      const hasta = Math.min(t.jd + s, jd1 + 1);
      const lonB = lonDia(t.c, hasta);
      t.sig = lonB;
      // Con separación a al principio del tramo y b al final, y el planeta a v °/día como
      // mucho, solo puede haber un día dentro del orbe si a + b ≤ 2·orbe + v·s. Solo entonces
      // se calcula día a día (0,1° de holgura por la estrella, que se toma a mitad de año).
      const cerca = datosEst.filter(x => trSep(lonAnual(x, y), lon) + trSep(lonAnual(x, y), lonB) <= 2 * orbe + v * (hasta - t.jd) + 0.1);
      if (cerca.length) {
        for (let jd = t.jd; jd < hasta; jd++) {
          const l = jd === t.jd ? lon : lonDia(t.c, jd);
          for (const x of cerca) {
            const k = x.e.nombre;
            // la estrella se mueve menos de 0,02° al año: si a mitad de año ya está lejos, no hace falta la exacta
            const d = trSep(lonAnual(x, y), l) > orbe + 0.1 ? 99 : trSep(MOTOR.longitudEstrella(x.e, jd), l);
            if (d <= orbe) {
              const p = t.abiertos.get(k);
              if (p && jd - p.jdHasta <= 1) { p.jdHasta = jd; if (d < p.orbe) { p.orbe = d; p.jdExacto = jd; } }
              else { cerrar(t, k); t.abiertos.set(k, { cuerpo: t.c, x, jdDesde: jd, jdHasta: jd, jdExacto: jd, orbe: d }); }
            } else cerrar(t, k);
          }
        }
      }
      for (const [k, p] of t.abiertos) if (!cerca.some(x => x.e.nombre === k)) cerrar(t, k);
      t.jd = hasta;
      $("t-estado").textContent = `Calculando ${t.c}${tareas.length > 1 ? ` (${it + 1} de ${tareas.length})` : ""} · ${y}…`;
    }
    if (it < tareas.length) { setTimeout(trozo, 0); return; }
    pintarTransitos(pasos, orbe, iE === "", cuerpos.length > 1);
  }
  $("t-tabla").innerHTML = "";
  trozo();
}

const TR_MAX_FILAS = 1500;
function pintarTransitos(pasos, orbe, variasEstrellas, variosCuerpos) {
  pasos.sort((a, b) => a.jdDesde - b.jdDesde);
  const diasHecho = CIELO ? Object.entries(CIELO.dias || {}) : [];
  const esMisma = p => { const n = trNatDe(p.x.rob); return !!(n && n.has(p.cuerpo)); };
  const conNat = pasos.filter(esMisma).length;
  const resumen = `${pasos.length} paso(s) a ${String(orbe).replace(".", ",")}° de 1885 a 2026${conNat ? ` · ${conNat} con el planeta de la misma naturaleza (Robson)` : ""}.`;
  if (!pasos.length) { $("t-estado").innerHTML = resumen; $("t-tabla").innerHTML = `<p class="vacio">Ningún paso en ese periodo.</p>`; return; }
  const filtro = variasEstrellas ? `<label class="nota"><input type="checkbox" id="t-solo"${pasos.length > TR_MAX_FILAS && conNat ? " checked" : ""}> solo los de la misma naturaleza</label>` : "";
  $("t-estado").innerHTML = resumen + " " + filtro;
  const fichasDe = (ya, yb) => fichas.filter(f => f.tipo !== "persona" && f.fecha && f.ini <= yb && f.fin >= ya && !st.ocultos.has(f.carril)).sort((x, y) => x.ini - y.ini).map(f => f.id);
  const pinta = () => {
    const solo = variasEstrellas && $("t-solo") && $("t-solo").checked;
    const lista = solo ? pasos.filter(esMisma) : pasos;
    const vis = lista.slice(0, TR_MAX_FILAS);
    const filas = vis.map((p, n) => {
      const a = trFecha(p.jdDesde), b = trFecha(p.jdHasta), ex = trFecha(p.jdExacto);
      const ya = +a.slice(0, 4), yb = +b.slice(0, 4);
      const nf = fichasDe(ya, yb).length;
      const hechos = diasHecho.filter(([id, v]) => v.fecha >= a && v.fecha <= b && porId[id]).map(([id]) => id);
      const misma = esMisma(p);
      const robTxt = p.x.rob ? (p.x.rob.naturaleza ? esc(p.x.rob.naturaleza) + (misma ? " ✓" : "") : "sin naturaleza escrita") : "—";
      return `<tr${misma ? ' class="t-misma"' : ""}>
        ${variosCuerpos || variasEstrellas ? `<td>${variosCuerpos ? `<b style="color:${COLOR_PLANETA[p.cuerpo] || "inherit"}">${esc(p.cuerpo)}</b>` : ""}${variasEstrellas ? ` ${variosCuerpos ? "· " : ""}${esc(p.x.e.nombre)}` : ""}</td>` : ""}
        <td>${a === b ? a : `${a} → ${b}`}</td><td>${ex} · ${p.orbe.toFixed(2).replace(".", ",")}°</td>
        ${variasEstrellas || variosCuerpos ? `<td>${robTxt}</td>` : ""}
        <td>${hechos.length ? `<b title="Hecho con día exacto dentro del paso">★ ${hechos.length}</b> ` : ""}${nf || hechos.length ? `<details data-n="${n}" data-a="${ya}" data-b="${yb}" data-h="${hechos.join(",")}"><summary>${nf} ficha(s) de ${ya === yb ? ya : ya + "–" + yb}</summary></details>` : `<span class="nota">ninguna</span>`}</td>
      </tr>`;
    }).join("");
    const cab = `<tr>${variosCuerpos || variasEstrellas ? `<th>${variosCuerpos ? "Planeta" : ""}${variosCuerpos && variasEstrellas ? " · " : ""}${variasEstrellas ? "Estrella" : ""}</th>` : ""}<th>Paso</th><th>Exacto · orbe</th>${variasEstrellas || variosCuerpos ? "<th>Robson</th>" : ""}<th>Fichas de esos años</th></tr>`;
    $("t-tabla").innerHTML = (lista.length > TR_MAX_FILAS ? `<p class="nota">Se muestran los ${TR_MAX_FILAS} primeros de ${lista.length}. Elige una estrella o marca «solo los de la misma naturaleza» para acotar.</p>` : "")
      + `<div class="t-wrap"><table class="t-tabla"><thead>${cab}</thead><tbody>${filas}</tbody></table></div>`;
    // la lista de fichas se arma al abrir cada paso, no antes
    $("t-tabla").querySelectorAll("details[data-n]").forEach(d => d.addEventListener("toggle", () => {
      if (!d.open || d.dataset.hecho) return;
      d.dataset.hecho = "1";
      const h = d.dataset.h ? d.dataset.h.split(",") : [];
      d.insertAdjacentHTML("beforeend", (h.length ? `<p class="nota">★ Con día dentro del paso:</p>${listaFichas(h)}` : "") + listaFichas(fichasDe(+d.dataset.a, +d.dataset.b)));
      d.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => ir(b.dataset.ir, st.sel));
    }));
  };
  if ($("t-solo")) $("t-solo").onchange = pinta;
  pinta();
}

function abrirFicha(f) {
  const c = carrilDe[f.carril];
  const persona = f.tipo === "persona";
  const segun = f.segun || [];
  const segunHTML = segun.length ? segun.map(s => {
    const au = autores[s.autor], ob = au?.obras?.find(o => o.id === s.obra);
    const donde = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.ubicacion || "enlace")}</a>` : esc(s.ubicacion);
    const contra = (s.contradice || []).length ? `<div class="contra">Contradice a: ${s.contradice.map(a => esc(autores[a]?.nombre || a)).join(", ")}</div>` : "";
    const sello = (s.coincide || []).map(a => { const e = segun.find(x => x.autor === a), aa = autores[a], oo = e && aa?.obras?.find(o => o.id === e.obra);
      return `<div class="sello">Coincide con <strong>${esc(aa?.nombre || a)}</strong>${e ? `, en <em>${esc(oo?.titulo || e.obra)}</em>` : ""}</div>`; }).join("");
    return `<div class="segun${(s.contradice || []).length ? " en-disputa" : ""}"><div class="quien">Según <strong>${esc(au?.nombre || s.autor)}</strong>, en <em>${esc(ob?.titulo || s.obra)}</em> (${donde})</div><p>${esc(s.resumen)}</p>${sello}${contra}</div>`;
  }).join("") : `<div class="vacio">Ningún autor registrado todavía para esta ficha.${f.estado === "prueba" ? " Es un dato de prueba." : ""}</div>`;
  const of = f.oficial;
  const ofFuente = !!(of && (of.fuentes || []).length);
  const oficialHTML = of && of.resumen ? `<div class="oficial"><p>${esc(of.resumen)}</p><ul class="fuentes">${(of.fuentes || []).map(x =>
      `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titulo)}</a>` : esc(x.titulo)}${x.consultado ? ` · consultado ${esc(x.consultado)}` : ""}</li>`).join("")}</ul></div>`
    : `<div class="vacio">Sin versión oficial todavía.</div>`;
  const citas = (f.citas || []).length ? `<section class="bloque"><h3>Citas</h3>${f.citas.map(q => `<p class="cita">${esc(q.resumen)} — ${esc(q.atribuida_a)} <em class="pill">${esc(q.verificacion)}</em></p>`).join("")}</section>` : "";
  const cx = conex[f.id];
  const conexHTML = cx.length ? `<section class="bloque"><h3>Lleva a · ${cx.length} conexion${cx.length === 1 ? "" : "es"}</h3><ul class="conex">${cx.map(k => { const o = porId[k.id];
      return `<li><button type="button" data-ir="${o.id}" style="--c:${color(o.carril)}"><i></i><span><strong>${esc(o.titulo)}</strong> · <span class="fecha" style="display:inline">${esc(fmtFecha(o, o.tipo === "persona", o.vivo))}</span></span>${k.nota ? `<small>${esc(k.nota)}</small>` : ""}</button></li>`; }).join("")}</ul></section>` : "";
  const temas = (f.temas || []).length ? `<section class="bloque"><h3>También toca</h3><div class="temas">${f.temas.map(t => `<span class="pill carr" style="--c:${color(t)}">${esc(carrilDe[t]?.nombre || t)}</span>`).join("")}</div></section>` : "";
  abrirPanel(`<div class="ficha-in">
    <div class="ficha-top"><span class="pill carr" style="--c:${color(f.carril)}">${esc(c?.nombre || f.carril)}</span>${f.naturaleza ? `<span class="pill carr" style="--c:${color(f.carril)}">${esc(NOMBRE_NAT[f.naturaleza] || f.naturaleza)}</span>` : ""}<span class="pill est-${f.estado}">${esc(f.estado)}</span>
      <button type="button" class="cerrar" id="cerrar">Cerrar</button></div>
    <div><h2>${esc(f.titulo)}</h2><div class="fecha">${esc(fmtFecha(f, persona, f.vivo))}${f.fecha?.margen ? ` (± ${f.fecha.margen} años)` : ""}${f.fecha?.fuente === "oficial" ? " · fecha de la versión oficial" : ""}</div>${f.fecha_autor ? `<div class="fautor">Fecha que da el autor: ${esc(f.fecha_autor)}</div>` : ""}</div>
    <p class="lead">${esc(f.resumen)}</p>
    <div class="cols">
      <section class="col"><h3>Según los autores</h3>${discrepan(f) ? `<div class="discrepa grande">Estos autores discrepan: se muestran todas las versiones, sin elegir ganador.</div><div class="disputa">${segunHTML}</div>` : segunHTML}</section>
      <section class="col"><h3>Versión oficial ${of && of.resumen ? (ofFuente ? `<span class="pill of-ok">con fuente</span>` : `<span class="pill of-sin">sin fuente</span>`) : ""}</h3>${oficialHTML}</section>
    </div>
    ${citas}${cieloDia(f)}${conexHTML}${contemporaneos(f)}${temas}
  </div>`);
}

// ---------- Eventos ----------
let rafScroll = 0;
escena.addEventListener("scroll", () => { cancelAnimationFrame(rafScroll); rafScroll = requestAnimationFrame(ahora); }, { passive: true });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !ficha.hidden) cerrarFicha();
  else if (e.key === "Backspace" && st.atras.length && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("volver").click(); }
});
new ResizeObserver(() => { if (app.hidden) return; const w = escena.clientWidth; if (Math.abs(w - anchoPrev) > 1) { anchoPrev = w; maquetar(true); } }).observe(escena);
document.fonts?.ready?.then(() => { if (!app.hidden) maquetar(true); });

// ---------- Rutas: la portada son los tránsitos; el eje vive en #/eje ----------
function mostrarTransitos() {
  app.hidden = true;
  transitosEl.hidden = false;
  if (!ficha.hidden) { ficha.hidden = true; st.sel = null; st.atras = []; }
}
function mostrarEje(desde) {
  app.hidden = false;
  transitosEl.hidden = true;
  if (!ficha.hidden) { ficha.hidden = true; st.sel = null; st.atras = []; }
  if (desde !== undefined && desde !== null && desde !== "") {
    requestAnimationFrame(() => {
      maquetar(true);
      const d = Number(desde);
      if (L && Number.isFinite(d)) desplazarA(Math.max(0, L.T(d) - 60));
    });
  }
}
function alCambiarHash() {
  const h = location.hash || "";
  if (h.startsWith("#/transitos")) {
    mostrarTransitos();
    if (window.TRANSITOS_APP) window.TRANSITOS_APP.render(h);
    return;
  }
  if (h.startsWith("#/eje")) {
    const qs = h.split("?")[1] || "";
    mostrarEje(new URLSearchParams(qs).get("desde"));
    return;
  }
  mostrarEje();
  const id = h.slice(1);
  if (id && porId[id]) {
    if (id !== st.sel) seleccionar(id, true);
    return;
  }
  // Sin ruta o ruta desconocida: la portada.
  history.replaceState(null, "", "#/transitos");
  mostrarTransitos();
  if (window.TRANSITOS_APP) window.TRANSITOS_APP.render("#/transitos");
}
addEventListener("hashchange", alCambiarHash);

// ---------- Arranque ----------
anchoPrev = escena.clientWidth;
maquetar(false);
if (!location.hash) history.replaceState(null, "", "#/transitos");
alCambiarHash();
})();
</script>
